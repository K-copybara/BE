apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatbot-service
  namespace: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chatbot-service
  template:
    metadata:
      labels:
        app: chatbot-service
    spec:
      containers:
        - name: chatbot-service
          image: tabletalk.kr.ncr.ntruss.com/chatbot-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8084
          envFrom:
            - configMapRef:
                name: chatbot-config
            - secretRef:
                name: chatbot-secret
          volumeMounts:
            - name: kafka-ca-cert
              mountPath: /etc/kafka/secrets
              readOnly: true
          resources:
            requests:
              cpu: 150m
              memory: 156Mi
            limits:
              cpu: 300m
              memory: 512Mi
      imagePullSecrets:
        - name: ncr-secret
      volumes:
        - name: kafka-ca-cert
          secret:
            secretName: kafka-cluster-clients-ca-cert
  revisionHistoryLimit: 1
---
apiVersion: v1
kind: Service
metadata:
  name: chatbot-service
  namespace: backend
spec:
  selector:
    app: chatbot-service
  ports:
    - name: http
      port: 80
      targetPort: 8084
      nodePort: 30084
  type: NodePort
